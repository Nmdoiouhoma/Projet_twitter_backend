nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['^http://localhost:5173$'] # L'URL exacte de votre React
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization'] # Très important pour le JWT !
        expose_headers: ['Link']
        max_age: 3600
